<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Pilot sign: GaU QR Tour</title>
  <!-- Source for pilot-sign.pdf. Rebuild the PDF with: python tools/make_sign.py -->
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    @page { size: A4; margin: 0; }
    * { box-sizing: border-box; }
    body {
      margin: 0; width: 210mm; height: 297mm;
      background: #FFF8EE; color: #1F1A14;
      font-family: "DM Sans", Arial, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: space-between;
      padding: 18mm 16mm 14mm;
    }
    .top { text-align: center; }
    .eyebrow { font-weight: 700; letter-spacing: 3px; font-size: 13pt; color: #9A3412; text-transform: uppercase; }
    h1 { font-family: "Bricolage Grotesque", Arial, sans-serif; font-weight: 800; font-size: 54pt; line-height: 1; margin: 6mm 0 4mm; }
    .sub { font-size: 17pt; color: #4A3D30; margin: 0; }
    .qr-card { background: #fff; border-radius: 8mm; padding: 8mm; box-shadow: 0 0 0 1.2mm #C2410C; }
    .qr-card img { display: block; width: 125mm; height: 125mm; }
    .steps { display: flex; gap: 10mm; font-size: 13pt; color: #4A3D30; }
    .steps b { color: #C2410C; }
    .foot { text-align: center; font-size: 10pt; color: #5C4D3D; line-height: 1.5; }
  </style>
</head>
<body>
  <div class="top">
    <div class="eyebrow">Karibu · Welcome</div>
    <h1>Scan me.</h1>
    <p class="sub">A one-minute look at life at Garissa University</p>
  </div>

  <div class="qr-card"><img src="qr-pilot.svg" alt="QR code to the GaU QR Tour page"></div>

  <div class="steps">
    <span><b>1</b> Open your camera</span>
    <span><b>2</b> Point at the code</span>
    <span><b>3</b> Tap the link</span>
  </div>

  <div class="foot">
    <!-- Add the approval line once permission is given, e.g. "Approved by [office], [date]" -->
    Pilot project by The Stonecoders<br>
    majidtech25.github.io/gau-qr-tour
  </div>
</body>
</html>
